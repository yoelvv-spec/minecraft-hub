<script>

const form = document.getElementById("skinForm");
const input = document.getElementById("playerInput");
const result = document.getElementById("result");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const player = input.value.trim();

    if (!player) {
        return;
    }

    result.innerHTML = `
        <div class="message">
            ⏳ Buscando skin...
        </div>
    `;

    const imageUrl =
        "https://api.mcskin.me/skin/" +
        encodeURIComponent(player);

    result.innerHTML = `
        <div class="skin-result">

            <img
                src="${imageUrl}"
                alt="Skin de Minecraft de ${player}"
                style="width:300px; image-rendering:pixelated;"
                onerror="mostrarError()"
            >

            <div class="skin-name">
                ${player}
            </div>

            <a
                class="download"
                href="${imageUrl}"
                target="_blank"
            >
                🖼️ Abrir skin
            </a>

        </div>
    `;

});

function mostrarError() {

    result.innerHTML = `
        <div class="message">
            ❌ No se pudo cargar la skin.
        </div>
    `;

}

</script>
