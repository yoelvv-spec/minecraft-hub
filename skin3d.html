<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visor 3D de Skin | MineHub</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f1f3f4;

    color: #172016;

}

header {

    background: #1b5e20;

    padding: 18px 20px;

}

header a {

    color: white;

    text-decoration: none;

    font-size: 24px;

    font-weight: bold;

}

.container {

    max-width: 1000px;

    margin: 40px auto;

    padding: 20px;

    text-align: center;

}

h1 {

    margin-bottom: 10px;

}

.viewer {

    width: 100%;

    max-width: 600px;

    height: 600px;

    margin: 30px auto;

    background: #dbe3e8;

    border-radius: 20px;

    overflow: hidden;

    position: relative;

}

#canvas {

    width: 100%;

    height: 100%;

    display: block;

}

.controls {

    margin-top: 15px;

    color: #666;

}

button {

    background: #2e7d32;

    border: none;

    color: white;

    padding: 12px 20px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    margin: 5px;

}

button:hover {

    background: #1b5e20;

}

</style>

</head>


<body>


<header>

<a href="index.html">

⛏️ MineHub

</a>

</header>


<div class="container">


<h1>

🧑 Skin 3D de Minecraft

</h1>


<p>

Arrastra el personaje para girarlo.

</p>


<div class="viewer">

<canvas id="canvas"></canvas>

</div>


<div class="controls">

Arrastra con el ratón o el dedo para girar.

</div>


<button onclick="resetCamera()">

↻ Reiniciar

</button>


</div>


<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';


const canvas = document.getElementById("canvas");

const viewer = document.querySelector(".viewer");


/* ESCENA */

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0xdbe3e8);


/* CÁMARA */

const camera =
new THREE.PerspectiveCamera(
    45,
    viewer.clientWidth / viewer.clientHeight,
    0.1,
    100
);

camera.position.set(0, 1, 5);


/* RENDER */

const renderer =
new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
});

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);


/* CONTROLES */

const controls =
new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;


/* LUZ */

const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(3, 5, 5);

scene.add(light);


const ambient =
new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(ambient);


/* CUBO DE PRUEBA */

const geometry =
new THREE.BoxGeometry(
    2,
    2,
    2
);


const material =
new THREE.MeshStandardMaterial({
    color: 0x2e7d32
});


const cube =
new THREE.Mesh(
    geometry,
    material
);


scene.add(cube);


/* ANIMACIÓN */

function animate() {

    requestAnimationFrame(animate);

    cube.rotation.y += 0.01;

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();


/* RESIZE */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
        viewer.clientWidth /
        viewer.clientHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            viewer.clientWidth,
            viewer.clientHeight
        );

    }
);

</script>


</body>

</html>
