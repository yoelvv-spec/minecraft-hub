<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba 3D - MineHub</title>

<style>

body {
    margin: 0;
    background: #dbe3e8;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    padding: 20px;
}

#viewer {
    width: 600px;
    height: 600px;
    max-width: 90vw;
    margin: auto;
}

canvas {
    display: block;
}

</style>

</head>


<body>

<h1>🟩 Prueba 3D MineHub</h1>

<div id="viewer"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

const viewer =
document.getElementById("viewer");


/* ESCENA */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0xdbe3e8);


/* CÁMARA */

const camera =
new THREE.PerspectiveCamera(
    45,
    viewer.clientWidth /
    viewer.clientHeight,
    0.1,
    100
);

camera.position.z = 5;


/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

viewer.appendChild(
    renderer.domElement
);


/* CUBO */

const geometry =
new THREE.BoxGeometry(
    2,
    2,
    2
);


const material =
new THREE.MeshBasicMaterial({
    color: 0x2e7d32
});


const cube =
new THREE.Mesh(
    geometry,
    material
);


scene.add(cube);


/* ANIMACIÓN */

function animate() {

    requestAnimationFrame(
        animate
    );

    cube.rotation.x += 0.01;

    cube.rotation.y += 0.01;

    renderer.render(
        scene,
        camera
    );

}


animate();

</script>


</body>

</html>
