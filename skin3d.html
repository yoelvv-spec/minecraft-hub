<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Skin 3D | MineHub</title>

<style>

body {
    margin: 0;
    background: #dbe3e8;
    font-family: Arial, sans-serif;
}

header {
    background: #1b5e20;
    padding: 18px 20px;
}

header a {
    color: white;
    text-decoration: none;
    font-size: 24px;
    font-weight: bold;
}

h1 {
    text-align: center;
}

#viewer {
    width: 600px;
    height: 650px;
    max-width: 95vw;
    margin: 20px auto;
    background: #cbd5da;
    border-radius: 20px;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.info {
    text-align: center;
    color: #555;
}

</style>

</head>


<body>


<header>

<a href="index.html">
⛏️ MineHub
</a>

</header>


<h1>🧑 Skin 3D de Minecraft</h1>

<p class="info">
Arrastra el personaje para girarlo.
</p>


<div id="viewer"></div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>


const viewer =
document.getElementById("viewer");


/* ESCENA */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0xcbd5da);


/* CÁMARA */

const camera =
new THREE.PerspectiveCamera(
    35,
    viewer.clientWidth /
    viewer.clientHeight,
    0.1,
    100
);

camera.position.set(
    5,
    3.5,
    8
);


/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

viewer.appendChild(
    renderer.domElement
);


/* LUCES */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);

const light =
new THREE.DirectionalLight(
    0xffffff,
    3
);

light.position.set(
    5,
    10,
    7
);

scene.add(light);


/* GRUPO */

const player =
new THREE.Group();

scene.add(player);


/* TEXTURA */

const loader =
new THREE.TextureLoader();

const texture =
loader.load(
    "https://TU-WORKER.workers.dev/skin?player=Notch"
);

texture.magFilter =
THREE.NearestFilter;

texture.minFilter =
THREE.NearestFilter;


/*
================================================
CREAR CUBO CON UV PERSONALIZADOS
================================================
*/

function createPart(
    width,
    height,
    depth,
    x,
    y,
    z
) {

    const geometry =
    new THREE.BoxGeometry(
        width,
        height,
        depth
    );

    const material =
    new THREE.MeshLambertMaterial({
        map: texture
    });

    const mesh =
    new THREE.Mesh(
        geometry,
        material
    );

    mesh.position.set(
        x,
        y,
        z
    );

    player.add(mesh);

    return mesh;

}


/*
================================================
CABEZA
================================================
*/

createPart(
    1,
    1,
    1,
    0,
    3.5,
    0
);


/*
================================================
CUERPO
================================================
*/

createPart(
    1,
    1.5,
    0.5,
    0,
    2.25,
    0
);


/*
================================================
BRAZOS
================================================
*/

createPart(
    0.5,
    1.5,
    0.5,
    -0.75,
    2.25,
    0
);

createPart(
    0.5,
    1.5,
    0.5,
    0.75,
    2.25,
    0
);


/*
================================================
PIERNAS
================================================
*/

createPart(
    0.5,
    1.5,
    0.5,
    -0.25,
    0.75,
    0
);

createPart(
    0.5,
    1.5,
    0.5,
    0.25,
    0.75,
    0
);


/*
================================================
SUELO
================================================
*/

const floorGeometry =
new THREE.PlaneGeometry(
    20,
    20
);

const floorMaterial =
new THREE.MeshLambertMaterial({
    color: 0xa5b0b5
});

const floor =
new THREE.Mesh(
    floorGeometry,
    floorMaterial
);

floor.rotation.x =
-Math.PI / 2;

floor.position.y =
0;

scene.add(floor);


/*
================================================
ROTACIÓN CON RATÓN
================================================
*/

let dragging = false;

let previousX = 0;


renderer.domElement.addEventListener(
    "mousedown",
    function(event) {

        dragging = true;

        previousX =
        event.clientX;

    }
);


window.addEventListener(
    "mouseup",
    function() {

        dragging = false;

    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging) {
            return;
        }

        const movement =
        event.clientX -
        previousX;

        player.rotation.y +=
        movement * 0.01;

        previousX =
        event.clientX;

    }
);


/*
================================================
ROTACIÓN TÁCTIL
================================================
*/

let touchX = 0;


renderer.domElement.addEventListener(
    "touchstart",
    function(event) {

        touchX =
        event.touches[0].clientX;

    }
);


renderer.domElement.addEventListener(
    "touchmove",
    function(event) {

        const newX =
        event.touches[0].clientX;

        const movement =
        newX - touchX;

        player.rotation.y +=
        movement * 0.01;

        touchX = newX;

    }
);


/*
================================================
ANIMACIÓN
================================================
*/

function animate() {

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );

}

animate();


/*
================================================
RESIZE
================================================
*/

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
        viewer.clientWidth /
        viewer.clientHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            viewer.clientWidth,
            viewer.clientHeight
        );

    }
);


</script>


</body>

</html>
