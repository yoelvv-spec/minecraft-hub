<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visor 3D de Skin | MineHub</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f1f3f4;

    color: #172016;

}

header {

    background: #1b5e20;

    padding: 18px 20px;

}

header a {

    color: white;

    text-decoration: none;

    font-size: 24px;

    font-weight: bold;

}

.container {

    max-width: 1000px;

    margin: 40px auto;

    padding: 20px;

    text-align: center;

}

h1 {

    margin-bottom: 10px;

}

.viewer {

    width: 100%;

    max-width: 600px;

    height: 600px;

    margin: 30px auto;

    background: #dbe3e8;

    border-radius: 20px;

    overflow: hidden;

    position: relative;

}

#canvas {

    width: 100%;

    height: 100%;

    display: block;

}

.controls {

    margin-top: 15px;

    color: #666;

}

button {

    background: #2e7d32;

    border: none;

    color: white;

    padding: 12px 20px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    margin: 5px;

}

button:hover {

    background: #1b5e20;

}

</style>

</head>


<body>


<header>

<a href="index.html">

⛏️ MineHub

</a>

</header>


<div class="container">


<h1>

🧑 Skin 3D de Minecraft

</h1>


<p>

Arrastra el personaje para girarlo.

</p>


<div class="viewer">

<canvas id="canvas"></canvas>

</div>


<div class="controls">

Arrastra con el ratón o el dedo para girar.

</div>


<button onclick="resetCamera()">

↻ Reiniciar

</button>


</div>


<script type="module">


import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';


import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';


const canvas =
document.getElementById("canvas");


const viewer =
document.querySelector(".viewer");


/* ESCENA */

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xdbe3e8);


/* CAMARA */

const camera =
new THREE.PerspectiveCamera(
35,
viewer.clientWidth /
viewer.clientHeight,
0.1,
100
);


camera.position.set(
5,
3,
7
);


/* RENDERER */

const renderer =
new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true
});


renderer.setPixelRatio(
window.devicePixelRatio
);


renderer.setSize(
viewer.clientWidth,
viewer.clientHeight
);


/* CONTROLES */

const controls =
new OrbitControls(
camera,
renderer.domElement
);


controls.enableDamping = true;

controls.target.set(
0,
1.5,
0
);


/* LUCES */

const ambient =
new THREE.AmbientLight(
0xffffff,
2
);

scene.add(ambient);


const light =
new THREE.DirectionalLight(
0xffffff,
3
);

light.position.set(
5,
10,
7
);

scene.add(light);


/* GRUPO DEL PERSONAJE */

const player =
new THREE.Group();

scene.add(player);


/* TEXTURA */

const textureLoader =
new THREE.TextureLoader();


const skinTexture =
textureLoader.load(
"https://api.mcskin.me/skin/Notch"
);


skinTexture.magFilter =
THREE.NearestFilter;

skinTexture.minFilter =
THREE.NearestFilter;


/* MATERIAL */

const material =
new THREE.MeshLambertMaterial({
    map: skinTexture
});


/*
------------------------------------------------
CABEZA
------------------------------------------------
*/

const headGeometry =
new THREE.BoxGeometry(
1,
1,
1
);


const head =
new THREE.Mesh(
headGeometry,
material
);


head.position.y = 3.5;

player.add(head);


/*
------------------------------------------------
CUERPO
------------------------------------------------
*/

const bodyGeometry =
new THREE.BoxGeometry(
1,
1.5,
0.5
);


const body =
new THREE.Mesh(
bodyGeometry,
material
);


body.position.y = 2.25;

player.add(body);


/*
------------------------------------------------
BRAZO IZQUIERDO
------------------------------------------------
*/

const armGeometry =
new THREE.BoxGeometry(
0.5,
1.5,
0.5
);


const leftArm =
new THREE.Mesh(
armGeometry,
material
);


leftArm.position.set(
-0.75,
2.25,
0
);


player.add(leftArm);


/*
------------------------------------------------
BRAZO DERECHO
------------------------------------------------
*/

const rightArm =
new THREE.Mesh(
armGeometry,
material
);


rightArm.position.set(
0.75,
2.25,
0
);


player.add(rightArm);


/*
------------------------------------------------
PIERNA IZQUIERDA
------------------------------------------------
*/

const legGeometry =
new THREE.BoxGeometry(
0.5,
1.5,
0.5
);


const leftLeg =
new THREE.Mesh(
legGeometry,
material
);


leftLeg.position.set(
-0.25,
0.75,
0
);


player.add(leftLeg);


/*
------------------------------------------------
PIERNA DERECHA
------------------------------------------------
*/

const rightLeg =
new THREE.Mesh(
legGeometry,
material
);


rightLeg.position.set(
0.25,
0.75,
0
);


player.add(rightLeg);


/* CENTRAR */

player.position.y =
-0.1;


/* REDIMENSIONAR */

window.addEventListener(
"resize",
function() {

    camera.aspect =
    viewer.clientWidth /
    viewer.clientHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        viewer.clientWidth,
        viewer.clientHeight
    );

});


/* REINICIAR */

window.resetCamera =
function() {

    camera.position.set(
        5,
        3,
        7
    );

    controls.target.set(
        0,
        1.5,
        0
    );

};


/* ANIMACIÓN */

function animate() {

    requestAnimationFrame(
        animate
    );

    controls.update();

    renderer.render(
        scene,
        camera
    );

}


animate();

</script>


</body>

</html>
